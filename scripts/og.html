<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>OG — Garage Mod 95</title>
<style>
  @font-face { font-family: 'Archivo'; font-weight: 400 900; font-stretch: 100% 125%; src: url(/fonts/archivo-var-latin.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400 700; src: url(/fonts/jetbrains-mono-var-latin.woff2) format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b0c0e; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; font-family: 'Archivo', sans-serif; color: #f4f5f7; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 80%; filter: saturate(.8) contrast(1.08) brightness(1.05); transform: scale(1.05) translateX(160px); }
  .shade { position: absolute; inset: 0; background:
    linear-gradient(90deg, rgba(11,12,14,.97) 0%, rgba(11,12,14,.85) 42%, rgba(11,12,14,.15) 80%),
    linear-gradient(180deg, rgba(11,12,14,.5), rgba(11,12,14,0) 30%, rgba(11,12,14,.7)); }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 60px 60px; -webkit-mask-image: radial-gradient(ellipse 60% 70% at 30% 50%, #000, transparent 75%); }
  .content { position: absolute; left: 72px; top: 64px; right: 72px; bottom: 64px; display: flex; flex-direction: column; }
  .logo { display: flex; align-items: center; gap: 16px; }
  .logo .g { font: 500 13px 'JetBrains Mono', monospace; letter-spacing: .34em; color: #8e959e; }
  .logo .m { font-weight: 900; font-stretch: 125%; font-size: 30px; line-height: 1; margin-top: 4px; }
  .red { color: #ff4136; }
  h1 { margin: auto 0 0; font-weight: 800; font-stretch: 110%; font-size: 66px; line-height: 1.02; letter-spacing: -.025em; max-width: 760px; }
  .metal { background: linear-gradient(100deg, #f4f5f7 0%, #9aa1aa 30%, #ffffff 46%, #7d848d 62%, #d5d9de 100%); -webkit-background-clip: text; color: transparent; }
  .row { margin-top: 34px; display: flex; gap: 12px; }
  .chip { font: 500 15px 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; padding: 10px 16px; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.02)); }
  .cta { background: #e10600; border-color: #e10600; font-weight: 700; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: #e10600; }
</style>
</head>
<body>
<div class="card">
  <img class="bg" src="https://images.unsplash.com/photo-1791425318454-bd945c35c8af?auto=format&fit=crop&w=1600&q=75" alt="">
  <div class="shade"></div>
  <div class="grid"></div>
  <div class="content">
    <div class="logo">
      <svg viewBox="0 0 40 40" width="56" height="56"><path d="M20 2.5 35.16 11.25v17.5L20 37.5 4.84 28.75v-17.5z" fill="#131417" stroke="#B4BAC2" stroke-width="2.2"/><circle cx="20" cy="20" r="10" fill="none" stroke="#2E3238" stroke-width="2"/><path d="M27.07 12.93A10 10 0 0 1 30 20" fill="none" stroke="#E10600" stroke-width="2.4"/><path d="M20 20 26 14" stroke="#ECEEF1" stroke-width="2.2" stroke-linecap="round"/><circle cx="20" cy="20" r="2.2" fill="#ECEEF1"/></svg>
      <div><div class="g">GARAGE</div><div class="m">MOD<span class="red">95</span></div></div>
    </div>
    <h1>Mécanique <span class="red">&amp;</span> diagnostic de <span class="metal">précision</span> à Sarcelles.</h1>
    <div class="row">
      <span class="chip">Toutes marques</span>
      <span class="chip">Révision constructeur</span>
      <span class="chip cta">Devis WhatsApp</span>
    </div>
  </div>
  <div class="bar"></div>
</div>
</body>
</html>
